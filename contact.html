<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact George Njoroge about web development projects and opportunities.">
    <title>Contact | George Njoroge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <script src="contact.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="site-name" href="project.html">George Njoroge</a>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="project.html">Home</a></li>
                    <li><a href="project.html#projects">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container contact-page">
        <section class="contact-intro" aria-labelledby="contact-title">
            <p class="eyebrow">Get in touch</p>
            <h1 id="contact-title">Let's talk about your project.</h1>
            <p>Have a question or an idea? Send me a note and I'll get back to you.</p>
            <a class="contact-email" href="mailto:georgenjoro@example.com">georgenjoro@example.com</a>
        </section>

        <form class="contact-form" id="contact-form">
            <div class="form-row">
                <div class="form-field">
                    <label for="name">Your name</label>
                    <input id="name" name="name" type="text" autocomplete="name" required>
                </div>
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
            </div>
            <div class="form-field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <div class="form-actions">
                <button class="button button-primary" type="submit">Open email</button>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>&copy; 2026 George Njoroge</p>
            <a href="project.html">Back to portfolio</a>
        </div>
    </footer>
</body>
</html>
